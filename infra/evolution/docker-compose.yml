# Evolution API local (WhatsApp via Baileys) para o canal de notificação.
# Subir:  docker compose -f infra/evolution/docker-compose.yml up -d
# Segredos em infra/evolution/.env (copiar de .env.example). Porta só em 127.0.0.1.
name: vizualizer-evolution

services:
  api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on: [postgres, redis]
    ports:
      - "127.0.0.1:56430:8080"
    env_file: .env
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: vizualizer
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - instancias:/evolution/instances

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - banco:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - cache:/data

volumes:
  instancias:
  banco:
  cache:
